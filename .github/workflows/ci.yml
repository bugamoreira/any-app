name: CI

# Este workflow NAO publica nada. O deploy do any.app.br e manual, por CLI,
# como o README descreve. Aqui so se verifica.

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

jobs:
  verificar:
    name: Tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      # NAO derruba, de proposito. O projeto tem 137 erros de lint herdados
      # (92 de componente definido dentro do render, 23 de variavel nao usada,
      # o resto de regras de hooks). Nenhum e de seguranca, e 'tsc -b' e o build
      # passam limpos.
      #
      # Travar o CI neles deixaria o vermelho permanente desde o primeiro dia —
      # e CI sempre vermelho nao avisa nada, so ensina a equipe a ignorar.
      # Enquanto o lint so reporta, vermelho significa: alguma coisa NOVA quebrou.
      #
      # Quando a divida for paga, tirar o continue-on-error. Conferir o tamanho
      # dela com: npm run lint 2>&1 | tail -3
      - name: Lint (reporta, nao derruba)
        run: npm run lint
        continue-on-error: true

      # tsc -b, NUNCA tsc --noEmit: o tsconfig.json deste projeto tem
      # "files": [] e so referencias, entao --noEmit nao checa absolutamente
      # nada e passa verde com o codigo quebrado.
      - name: Checagem de tipos
        run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  auditoria:
    name: Dependencias de producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      # So --omit=dev: o que chega ao navegador do plantonista. Falha de
      # dependencia de desenvolvimento nao alcanca usuario e nao vale travar
      # o trabalho por ela — aparece no relatorio abaixo, sem derrubar.
      - name: Auditoria de producao (derruba em high)
        run: npm audit --omit=dev --audit-level=high

      - name: Relatorio completo (nao derruba)
        if: always()
        run: npm audit || true
