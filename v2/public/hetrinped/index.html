<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E8A80">
<title>Ped Guide — HETRIN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --teal:#0E8A80;
  --teal-dark:#0A6B60;
  --teal-soft:#E3F1EF;
  --bg:#F4F7F6;
  --card:#FFFFFF;
  --border:#DCE6E4;
  --border-strong:#C2D3D0;
  --text:#16302C;
  --text-2:#4E6662;
  --muted:#7E938F;
  --danger:#C62828;
  --danger-bg:#FBEAEA;
  --warning:#9A6700;
  --warning-bg:#FFF4D6;
  --success:#2E7D32;
  --success-bg:#E8F3E9;
  --info:#1565C0;
  --info-bg:#E7F0FB;
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;background:var(--bg);color:var(--text);
  padding-bottom:150px;
}
button{font-family:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* Disclaimer */
.disclaimer{
  position:sticky;top:0;z-index:200;
  background:var(--warning-bg);color:var(--warning);
  font-size:12px;font-weight:600;text-align:center;
  padding:8px 16px;border-bottom:1px solid #EAD9A8;
}

/* Brand header */
.rounded-font{font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.brand{
  background:linear-gradient(180deg,#FFFFFF 0%,#F0F7F6 100%);
  padding:28px 16px 24px;text-align:center;border-bottom:1px solid var(--border);
}
.brand-name{
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--teal);font-weight:800;font-size:31px;line-height:1.08;
  letter-spacing:-0.8px;
}
.brand-sub{
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--teal);font-weight:700;font-size:15px;margin-top:6px;letter-spacing:-0.2px;
}
.brand-tool{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 18px;border-radius:999px;
  background:var(--teal);color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 4px 14px rgba(14,138,128,.3);
}
.brand-tool svg{flex-shrink:0}

/* Input bar */
.input-bar{background:var(--card);padding:16px;border-bottom:4px solid var(--teal)}
.input-grid{max-width:500px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.input-card{border:2px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg);transition:border-color .2s,background .2s;position:relative}
.input-card.active{border-color:var(--teal);background:var(--teal-soft)}
.input-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.input-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.src-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--teal);color:#fff}
.peso-row{display:flex;align-items:center;gap:6px}
.peso-row input{
  flex:1;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:1.4rem;font-weight:700;background:transparent;border:none;outline:none;color:var(--text);
}
.peso-unit{font-size:.85rem;font-weight:600;color:var(--muted)}
.peso-hint{font-size:10px;color:var(--muted);margin-top:2px}
.bro-btn{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);
  cursor:pointer;min-height:44px;color:#fff;font-weight:700;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
  background:#6B7280;border:none;width:100%;text-align:left;
}
.bro-btn .dot{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.35);flex-shrink:0}
.bro-menu{
  position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:150;
  background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius);
  box-shadow:0 12px 32px rgba(22,48,44,.18);max-height:300px;overflow-y:auto;
}
.bro-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.bro-item:last-child{border-bottom:none}
.bro-item:active{background:var(--teal-soft)}
.bro-item .sw{width:30px;height:30px;border-radius:8px;flex-shrink:0}
.bro-item .nm{font-weight:700;font-size:.9rem;color:var(--text)}
.bro-item .dt{font-size:.78rem;color:var(--muted)}
.backdrop{position:fixed;inset:0;z-index:100}

/* Container */
.container{max-width:500px;margin:0 auto;padding:0 16px}

/* Nav cards (home) */
.nav-card{
  background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);
  border-radius:var(--radius);padding:20px;margin-bottom:12px;cursor:pointer;transition:background .15s;
  box-shadow:0 2px 10px rgba(22,48,44,.06);
}
.nav-card:active{background:var(--teal-soft)}
.nav-card .t{
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:18px;font-weight:700;color:var(--text);
}
.nav-card .d{font-size:.8rem;color:var(--muted);margin-top:4px}
.nav-card.red{border-left-color:var(--danger)}
.nav-card.blue{border-left-color:var(--info)}

/* Back button */
.btn-back{
  background:transparent;border:1px solid var(--border-strong);color:var(--text-2);
  padding:8px 16px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;
  margin-bottom:16px;min-height:44px;
}
.btn-back:active{background:var(--teal-soft)}
.view-title{
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:21px;font-weight:800;margin-bottom:16px;color:var(--teal-dark);letter-spacing:-0.3px;
}
.pt{padding-top:20px}

/* Collapsible */
.col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.col-head{
  width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:none;border:none;
  cursor:pointer;text-align:left;min-height:44px;
}
.col-head .ct{flex:1;font-size:15px;font-weight:600;color:var(--text)}
.col-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}
.chev{transition:transform .3s;flex-shrink:0;color:var(--muted)}
.col.open .chev{transform:rotate(180deg)}
.col-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.col-inner{padding:4px 14px 16px}

/* Drug cards */
.drug{border:2px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:var(--card)}
.drug.hl{border-color:var(--danger)}
.drug-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--teal-soft)}
.drug.hl .drug-head{background:var(--danger)}
.drug-name{font-weight:700;font-size:.95rem;color:var(--teal-dark)}
.drug.hl .drug-name{color:#fff}
.drug-pres{font-size:.8rem;margin-top:2px;color:var(--text-2)}
.drug.hl .drug-pres{color:rgba(255,255,255,.85)}
.drug-badge{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;font-weight:600;padding:6px 10px;background:var(--card);color:var(--text);border-radius:6px;border:1px solid var(--border)}
.drug-body{padding:16px}
.drug-instr{font-size:.8rem;color:var(--text-2);line-height:1.5;margin-bottom:12px}
.drug-res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{display:flex;flex-direction:column;align-items:center;gap:4px}
.res-l{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.res-v{
  font-family:ui-monospace,Menlo,monospace;font-size:1.25rem;font-weight:700;color:var(--teal-dark);
  background:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);border:2px solid var(--border);
  text-align:center;min-width:90px;
}
.res-v span{font-size:.8rem;color:var(--muted);font-weight:400}
.res-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:8px}
.need-weight{text-align:center;font-size:.8rem;color:var(--warning);padding:8px 0}
.btn-prep{
  margin-top:12px;padding:10px 14px;background:var(--teal-soft);color:var(--teal-dark);
  border:none;border-radius:var(--radius-sm);font-size:.8rem;font-weight:700;cursor:pointer;min-height:44px;
}

/* PCR params */
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.panel-label{font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:480px){.param-grid{grid-template-columns:repeat(4,1fr)}}
.param{border-radius:var(--radius);padding:14px 8px;text-align:center;border:2px solid}
.param .pl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.param .pv{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800}
.param.red{background:var(--danger-bg);border-color:#EBB6B6}.param.red .pv{color:var(--danger)}
.param.blue{background:var(--info-bg);border-color:#B7CFEC}.param.blue .pv{color:var(--info)}
.param.green{background:var(--success-bg);border-color:#BBD8BD}.param.green .pv{color:var(--success)}
.param.purple{background:#F1EAF9;border-color:#D4C3EA}.param.purple .pv{color:#6A3FA0}

/* Defib */
.defib-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
@media(min-width:480px){.defib-grid{grid-template-columns:repeat(3,1fr)}}
.defib{border-radius:var(--radius);padding:18px;text-align:center;color:#fff}
.defib.shock{background:linear-gradient(135deg,#C62828,#8E1B1B)}
.defib.cardio{background:linear-gradient(135deg,#37474F,#263238)}
.defib .dl{font-size:.72rem;font-weight:700;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.defib .dv{font-family:ui-monospace,Menlo,monospace;font-size:1.9rem;font-weight:700}
.defib .du{font-size:.95rem;opacity:.85}

/* 6H 6T */
.ht-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:480px){.ht-grid{grid-template-columns:1fr 1fr}}
.ht-box{background:var(--bg);border-radius:var(--radius);padding:14px}
.ht-box .htt{font-size:.75rem;font-weight:800;text-transform:uppercase;margin-bottom:10px}
.ht-box .htt.h{color:var(--danger)}
.ht-box .htt.t{color:#6A3FA0}
.ht-box ul{list-style:none}
.ht-box li{font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ht-box li:last-child{border-bottom:none}
.ht-box li b{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}

/* Equipment */
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:480px){.eq-grid{grid-template-columns:repeat(3,1fr)}}
.eq{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.eq .el{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.eq .ev{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;font-weight:700;color:var(--text)}
.eq .eu{font-size:.72rem;color:var(--muted);margin-top:4px}

/* Scenario cards */
.scn{background:var(--card);border:1px solid var(--border);border-left:4px solid;border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer}
.scn:active{background:var(--teal-soft)}
.scn .st{font-size:16px;font-weight:600}
.scn .sd{font-size:12px;color:var(--muted);margin-top:4px}

/* Checklist */
.chk-box{background:var(--bg);border-radius:var(--radius);padding:6px 14px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk .cb{
  width:24px;height:24px;border-radius:6px;border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s;
}
.chk.done .cb{background:var(--success);border-color:var(--success)}
.chk .cb svg{display:none}
.chk.done .cb svg{display:block}
.chk .cl{flex:1;font-size:.85rem}
.chk .cv{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--teal-dark);font-size:.85rem}

/* Transfusion */
.tx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tx{border:2px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--bg)}
.tx.blood{border-color:#EBB6B6;background:var(--danger-bg)}
.tx .tn{font-weight:700;font-size:.85rem;margin-bottom:2px}
.tx .td{font-size:.75rem;color:var(--muted);margin-bottom:10px}
.tx .tv{font-family:ui-monospace,Menlo,monospace;font-size:1.35rem;font-weight:700;color:var(--danger)}

/* Alert */
.alert{border-left:4px solid;border-radius:var(--radius-sm);padding:12px 14px;margin-top:16px;font-size:.8rem}
.alert.warn{background:var(--warning-bg);border-color:#D9A420}
.alert .at{font-weight:700;color:var(--warning);margin-bottom:6px;font-size:.85rem}

/* Infusion */
.inf-band{background:var(--teal);color:#fff;padding:8px 16px;border-radius:16px;font-size:.85rem;text-align:center;margin-bottom:16px;font-weight:500}
.inf-search{
  width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);
  font-size:.9rem;color:var(--text);outline:none;margin-bottom:16px;font-family:inherit;
}
.inf-search:focus{border-color:var(--teal)}
.inf-cat{font-weight:700;font-size:.9rem;color:var(--text-2);margin:4px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.inf{border:2px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:var(--card);transition:border-color .2s,box-shadow .2s}
.inf.hl{border-color:var(--info);box-shadow:0 0 0 3px rgba(21,101,192,.25)}
.inf-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;color:#fff}
.inf-head .in{font-weight:700;font-size:.9rem}
.inf-head .ir{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:6px}
.inf-body{padding:14px}
.prep-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px}
.prep-box .pt2{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prep-box .pd{font-size:.8rem;line-height:1.6;color:var(--text-2)}
.prep-box .pd b{color:var(--muted);font-weight:600}
.inf-warn{background:var(--warning-bg);color:var(--warning);font-size:.75rem;padding:6px 10px;border-radius:6px;margin-top:8px;font-weight:600}
.dose-row{display:flex;align-items:center;gap:12px}
.dose-row input[type=range]{flex:1;height:6px;accent-color:var(--teal)}
.dose-num{
  font-family:ui-monospace,Menlo,monospace;font-size:1rem;font-weight:700;width:72px;padding:6px 4px;
  background:var(--bg);border:2px solid var(--border-strong);border-radius:var(--radius-sm);
  text-align:center;color:var(--text);outline:none;
}
.dose-num.oor{border-color:var(--danger);color:var(--danger)}
.dose-unit{font-size:.78rem;color:var(--muted);white-space:nowrap}
.oor-msg{font-size:12px;color:var(--danger);text-align:center;margin-top:4px;min-height:0}
.rate-wrap{display:flex;justify-content:center;margin-top:12px}
.rate{
  background:linear-gradient(135deg,var(--teal),#0B5E58);color:#fff;border-radius:var(--radius);
  padding:14px 24px;text-align:center;min-width:150px;
}
.rate .rl{font-size:.72rem;font-weight:600;text-transform:uppercase;opacity:.9;margin-bottom:4px}
.rate input{
  font-family:ui-monospace,Menlo,monospace;font-size:1.6rem;font-weight:700;background:transparent;
  border:none;text-align:center;width:100%;color:#fff;outline:none;
}
.rate input::placeholder{color:rgba(255,255,255,.5)}
.rate .ru{font-size:.72rem;opacity:.9}
.sec-label{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}

/* Fluids */
.fl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:480px){.fl-grid{grid-template-columns:repeat(3,1fr)}}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(22,48,44,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-ov[hidden]{display:none}
.modal-box{background:var(--card);border-radius:16px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head .mt{font-size:17px;font-weight:700}
.modal-close{background:var(--bg);border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2)}
.prep-step{display:flex;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.prep-step:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.prep-step .n{
  width:28px;height:28px;background:var(--teal);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;
}
.prep-step .s{font-size:.9rem;line-height:1.5}

/* FAB */
.fab-btn{
  position:fixed;bottom:88px;right:20px;z-index:250;width:56px;height:56px;border-radius:50%;
  background:var(--teal);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(14,138,128,.4);
}
.fab-menu{
  position:fixed;bottom:152px;right:20px;z-index:250;display:none;flex-direction:column;gap:8px;
}
.fab-menu.open{display:flex}
.fab-item{
  background:var(--card);border:1px solid var(--border-strong);color:var(--text);
  padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 14px rgba(22,48,44,.15);text-align:right;min-height:44px;
}
.fab-item:active{background:var(--teal-soft)}

/* Footer */
footer{
  position:fixed;bottom:0;left:0;right:0;z-index:150;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:12px 16px 14px;text-align:center;line-height:1.5;
}
.ft-dev{font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:8px}
.ft-dev strong{
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--teal-dark);font-weight:700;
}
.ft-sep{width:3px;height:3px;border-radius:50%;background:var(--border-strong);display:inline-block}
.ft-meta{
  font-size:10px;color:var(--muted);margin-top:3px;
  text-transform:uppercase;letter-spacing:.8px;font-weight:600;
}
</style>
</head>
<body>

<div class="disclaimer">Ferramenta de apoio em teste — não substitui o julgamento clínico.</div>

<header class="brand">
  <div class="brand-name">Hospital Estadual<br>de Trindade</div>
  <div class="brand-sub">Walda Ferreira dos Santos</div>
  <div class="brand-tool">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
    Ped Guide
  </div>
</header>

<div class="input-bar">
  <div class="input-grid">
    <div class="input-card" id="peso-card">
      <div class="input-card-top">
        <span class="input-label">Peso</span>
        <span class="src-tag" id="peso-src" hidden>FONTE</span>
      </div>

function weightCat(p){ if (p < 15) return 'small'; if (p <= 40) return 'medium'; return 'large'; }
function weightCatLabel(c){ return c === 'small' ? '< 15 kg' : c === 'medium' ? '15-40 kg' : '> 40 kg'; }

function formatConc(conc, unit){
  if (unit.includes('mU/')) return conc >= 1000 ? fN(conc/1000,1)+' U/mL' : conc+' mU/mL';
  if (unit.includes('mcg')) return conc >= 1000 ? fN(conc/1000,1)+' mg/mL' : conc+' mcg/mL';
  return conc+' mg/mL';
}

function calcRate(inf, dose, p){
  const dil = inf.dilutions[weightCat(p)];
  if (inf.unit === 'mcg/kg/min') return (dose*p*60)/dil.conc;
  if (inf.unit === 'mcg/kg/h')   return (dose*p)/dil.conc;
  if (inf.unit === 'mg/kg/h')    return (dose*p)/dil.conc;
  if (inf.unit === 'mU/kg/min')  return (dose*p*60)/dil.conc;
  return 0;
}

function calcDoseFromRate(inf, mlh, p){
  const dil = inf.dilutions[weightCat(p)];
  if (inf.unit === 'mcg/kg/min') return (mlh*dil.conc)/(p*60);
  if (inf.unit === 'mcg/kg/h')   return (mlh*dil.conc)/p;
  if (inf.unit === 'mg/kg/h')    return (mlh*dil.conc)/p;
  if (inf.unit === 'mU/kg/min')  return (mlh*dil.conc)/(p*60);
  return 0;
}

function infDecimals(inf){ return inf.step < 0.1 ? 2 : inf.step < 1 ? 1 : 0; }

function infCard(inf){
  const p = getPeso();
  const cat = weightCat(p || 10);
  const dil = inf.dilutions[cat];
  const dose = state.doses[inf.id] ?? inf.defaultVal;
  const dec = infDecimals(inf);
  const rate = p > 0 ? calcRate(inf, dose, p) : null;
  const oor = dose < inf.range[0] || dose > inf.range[1];
  const hl = state.hlInf.includes(inf.id);
  const clamped = Math.min(inf.range[1], Math.max(inf.range[0], dose));
  const rateTxt = rate !== null ? (rate < 0.1 ? fN(rate,2) : fN(rate,1)) : '';
  return '<div class="inf' + (hl ? ' hl' : '') + '" data-inf-card="' + inf.id + '">' +
    '<div class="inf-head" style="background:' + inf.color + '">' +
      '<span class="in">' + inf.name + '</span>' +
      '<span class="ir">' + inf.range[0] + '-' + inf.range[1] + ' ' + inf.unit + '</span>' +
    '</div>' +
    '<div class="inf-body">' +
      '<div class="prep-box">' +
        '<div class="pt2">Preparo</div>' +
        '<div class="pd"><b>Ampola:</b> ' + inf.presentation + '<br>' +
        '<b>Droga:</b> ' + dil.drug + ' mL + <b>Diluente:</b> ' + dil.diluent + ' mL<br>' +
        '<b>Volume final:</b> ' + dil.vol + ' mL | <b>Conc.:</b> ' + formatConc(dil.conc, inf.unit) + '</div>' +
        (inf.warning ? '<div class="inf-warn">' + inf.warning + '</div>' : '') +
      '</div>' +
      '<div class="sec-label">Dose</div>' +
      '<div class="dose-row">' +
        '<input type="range" min="' + inf.range[0] + '" max="' + inf.range[1] + '" step="' + inf.step + '" value="' + clamped + '" data-inf-slider="' + inf.id + '">' +
        '<input type="number" inputmode="decimal" class="dose-num' + (oor ? ' oor' : '') + '" value="' + dose.toFixed(dec) + '" step="' + inf.step + '" data-inf-dose="' + inf.id + '">' +
        '<span class="dose-unit">' + inf.unit + '</span>' +
      '</div>' +
      '<div class="oor-msg" data-inf-oor="' + inf.id + '">' + (oor ? 'Fora do range (' + inf.range[0] + '-' + inf.range[1] + ')' : '') + '</div>' +
      '<div class="rate-wrap"><div class="rate">' +
        '<div class="rl">Velocidade</div>' +
        '<input type="text" inputmode="decimal" value="' + rateTxt + '" placeholder="' + (p > 0 ? '--' : 'Peso?') + '" data-inf-rate="' + inf.id + '">' +
        '<div class="ru">mL/h</div>' +
      '</div></div>' +
    '</div></div>';
}

  html += collapsible('infusoes', 'Infusões contínuas', weightCatLabel(cat), '#8B5CF6', infInner);

  return html + '</div>';
}

  else if (state.view === 'pcr') app.innerHTML = viewPcr();
  else if (state.view === 'cenarios') app.innerHTML = viewCenarios();
  else app.innerHTML = viewCalculadoras();

  if (state.infSearch) applyInfFilter();

  if (state.pendingScroll) {
    const el = document.querySelector('[data-drug="' + state.pendingScroll + '"]');
    state.pendingScroll = null;
    if (el) setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'center' }), 150);
  }
}

  $('#bro-card').classList.toggle('active', state.source === 'broselow');
}

// ==========================================
// COLLAPSIBLE ANIMATION
// ==========================================
function toggleSection(key){
  const sec = document.querySelector('[data-sec="' + key + '"]');
  if (!sec) return;
  const body = sec.querySelector('.col-body');
  const isOpen = sec.classList.contains('open');
  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    void body.offsetHeight;
    body.style.maxHeight = '0px';
    sec.classList.remove('open');
    delete state.openSections[key];
  } else {
    sec.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
    state.openSections[key] = true;
    body.addEventListener('transitionend', function h(e){
      if (e.propertyName === 'max-height' && sec.classList.contains('open')) body.style.maxHeight = 'none';
      body.removeEventListener('transitionend', h);
    });
  }
}

function updateInfCard(id, origin){
  const inf = INFUSIONS.find(x => x.id === id);
  const card = document.querySelector('[data-inf-card="' + id + '"]');
  if (!inf || !card) return;
  const p = getPeso();
  const dose = state.doses[id] ?? inf.defaultVal;
  const dec = infDecimals(inf);
  const oor = dose < inf.range[0] || dose > inf.range[1];

  const slider = card.querySelector('[data-inf-slider]');
  const doseIn = card.querySelector('[data-inf-dose]');
  const rateIn = card.querySelector('[data-inf-rate]');
  const oorMsg = card.querySelector('[data-inf-oor]');

  if (origin !== 'slider') slider.value = Math.min(inf.range[1], Math.max(inf.range[0], dose));
  if (origin !== 'dose') doseIn.value = dose.toFixed(dec);
  doseIn.classList.toggle('oor', oor);
  oorMsg.textContent = oor ? 'Fora do range (' + inf.range[0] + '-' + inf.range[1] + ')' : '';

  if (origin !== 'rate') {
    if (p > 0) {
      const rate = calcRate(inf, dose, p);
      rateIn.value = rate < 0.1 ? fN(rate,2) : fN(rate,1);
    } else {
      rateIn.value = '';
    }
  }
}

function applyInfFilter(){
  const q = state.infSearch.toLowerCase().trim();
  document.querySelectorAll('[data-inf-card]').forEach(card => {
    const id = card.getAttribute('data-inf-card');
    const inf = INFUSIONS.find(x => x.id === id);
    card.style.display = (!q || inf.name.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('[data-inf-group]').forEach(g => {
    const visible = Array.from(g.querySelectorAll('[data-inf-card]')).some(c => c.style.display !== 'none');
    g.style.display = visible ? '' : 'none';
  });
  const openBody = document.querySelector('[data-sec="infusoes"].open .col-body');
  if (openBody) openBody.style.maxHeight = 'none';
}

// ==========================================
// NAVEGACAO
// ==========================================
function showView(v){
  state.view = v;
  state.scenarioBack = false;
  state.hlDrugs = [];
  state.hlInf = [];
  state.openSections = {};
  renderView();
  window.scrollTo(0, 0);
}

function loadScenario(key){
  const cfg = SCENARIO_CONFIGS[key];
  if (!cfg) return;
  state.view = 'calculadoras';
  state.scenarioBack = true;
  state.hlDrugs = cfg.highlight;
  state.hlInf = cfg.infusionHighlight;
  state.openSections = {};
  for (const s of cfg.sections) state.openSections[s] = true;
  state.pendingScroll = cfg.scrollTo;
  renderView();
  if (!cfg.scrollTo) window.scrollTo(0, 0);
}

// ==========================================
// MODAL
// ==========================================
function openPrep(key){
  const prep = PREPARATIONS[key];
  if (!prep) return;
  $('#modal-title').textContent = 'Preparação: ' + prep.title;
  $('#modal-body').innerHTML = prep.steps.map((s, i) =>
    '<div class="prep-step"><div class="n">' + (i+1) + '</div><div class="s">' + s + '</div></div>'
  ).join('');
  $('#modal').hidden = false;
}

// ==========================================
// EVENTOS
// ==========================================
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');

  // FAB
  const fabBtn = e.target.closest('#fab-btn');
  const fabItem = e.target.closest('.fab-item');
  const fabMenu = $('#fab-menu');
  if (fabBtn) { fabMenu.classList.toggle('open'); return; }
  if (fabItem) { fabMenu.classList.remove('open'); showView(fabItem.getAttribute('data-view')); return; }
  if (!e.target.closest('#fab-menu')) fabMenu.classList.remove('open');

  // Broselow dropdown
  if (e.target.closest('#bro-btn')) {
    const menu = $('#bro-menu');
    menu.hidden = !menu.hidden;
    $('#backdrop').hidden = menu.hidden;
    return;
  }
  const broItem = e.target.closest('[data-bro]');
  if (broItem) {
    const key = broItem.getAttribute('data-bro');
    const entry = BROSELOW.find(b => b.key === key);
    state.broKey = key;
    state.peso = entry.peso;
    state.source = 'broselow';
    $('#peso-input').value = entry.peso;
    $('#bro-menu').hidden = true;
    $('#backdrop').hidden = true;
    updateBroselowChip();
    renderView();
    return;
  }
  if (e.target.closest('#backdrop')) {
    $('#bro-menu').hidden = true;
    $('#backdrop').hidden = true;
    return;
  }

  // Modal fecha clicando fora
  if (e.target.id === 'modal') { $('#modal').hidden = true; return; }

  if (!t) return;
  const action = t.getAttribute('data-action');
  if (action === 'nav') showView(t.getAttribute('data-view'));
  else if (action === 'back-calc') showView(state.scenarioBack ? 'cenarios' : 'home');
  else if (action === 'scenario') loadScenario(t.getAttribute('data-key'));
  else if (action === 'toggle-sec') toggleSection(t.getAttribute('data-sec-key'));
  else if (action === 'prep') openPrep(t.getAttribute('data-prep'));
  else if (action === 'modal-close') $('#modal').hidden = true;
  else if (action === 'check') {
    const idx = t.getAttribute('data-idx');
    state.checklist[idx] = !state.checklist[idx];
    t.classList.toggle('done', !!state.checklist[idx]);
  }
});

document.addEventListener('input', e => {
  const el = e.target;

  if (el.id === 'peso-input') {
    const v = parseFloat(el.value.replace(',', '.'));
    if (!isNaN(v) && v >= 0.5 && v <= 50) {
      state.peso = v;
      state.source = 'peso';
      state.broKey = null;
    } else if (el.value === '') {
      state.peso = null;
      state.source = null;
      state.broKey = null;
    } else {
      return;
    }
    updateBroselowChip();
    renderView();
    return;
  }

  if (el.id === 'inf-search') {
    state.infSearch = el.value;
    applyInfFilter();
    return;
  }

  const sliderId = el.getAttribute('data-inf-slider');
  if (sliderId) {
    state.doses[sliderId] = parseFloat(el.value);
    updateInfCard(sliderId, 'slider');
    return;
  }

  const doseId = el.getAttribute('data-inf-dose');
  if (doseId) {
    const v = parseFloat(el.value.replace(',', '.'));
    if (!isNaN(v)) {
      state.doses[doseId] = v;
      updateInfCard(doseId, 'dose');
    }
    return;
  }

  const rateId = el.getAttribute('data-inf-rate');
  if (rateId) {
    const mlh = parseFloat(el.value.replace(',', '.'));
    const p = getPeso();
    if (!isNaN(mlh) && mlh > 0 && p > 0) {
      const inf = INFUSIONS.find(x => x.id === rateId);
      state.doses[rateId] = calcDoseFromRate(inf, mlh, p);
      updateInfCard(rateId, 'rate');
    }
    return;
  }
});

// ==========================================
// INIT
// ==========================================
(function init(){
  $('#bro-menu').innerHTML = BROSELOW.map(b =>
    '<div class="bro-item" data-bro="' + b.key + '">' +
      '<div class="sw" style="background:' + b.color + (b.dark ? ';border:1px solid #C2D3D0' : '') + '"></div>' +
      '<div><div class="nm">' + b.name + '</div>' +
      '<div class="dt">' + b.peso + ' kg - ' + formatIdade(b.idadeMeses) + ' - ' + b.min + '-' + b.max + ' cm</div></div>' +
    '</div>'
  ).join('');
  updateBroselowChip();
  renderView();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
